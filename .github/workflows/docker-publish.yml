name: Publish Docker image

# Publishes to GitHub Container Registry:
#   docker pull ghcr.io/simwss/discord-v2:latest
#
# Tags produced:
#   latest          - newest build of the default branch
#   main            - branch builds
#   main-<sha>      - immutable, per-commit
#   1.2.3 / 1.2 / 1 - when a v1.2.3 git tag is pushed
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Never publish an image that would not pass CI.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required to attach a signed build provenance attestation.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      # Enables building the arm64 image (Raspberry Pi, Apple Silicon, Graviton).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=rasselbande-bot
            org.opencontainers.image.description=Discord Bot der Rasselbande

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Lets anyone verify the image was built from this repo by this workflow:
      #   gh attestation verify oci://ghcr.io/simwss/discord-v2:latest -R simwss/discord-v2
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:latest"
            echo '```'
            echo
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "**Tags:**"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
